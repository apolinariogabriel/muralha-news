name: 📰 Monitor de Notícias (terça 23h)

on:
  # Roda toda TERÇA-FEIRA às 23h (horário de Brasília).
  # Como o GitHub usa UTC, 23h em Brasília (UTC-3) = 02h de QUARTA em UTC.
  # Assim você recebe o compilado antes das reuniões de quarta/quinta.
  schedule:
    - cron: '0 2 * * 3'

  # Permite rodar manualmente pelo GitHub a qualquer hora
  workflow_dispatch:

jobs:
  monitorar:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar o código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: pip install -r requirements.txt

      - name: 🔎 Rodar o monitor e enviar e-mail
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          SENHA_APP:       ${{ secrets.SENHA_APP }}
          EMAIL_DESTINO:   ${{ secrets.EMAIL_DESTINO }}
        run: python monitor.py
