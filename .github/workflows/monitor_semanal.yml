name: 📰 Monitor de Notícias Semanal

on:
  # Roda toda segunda-feira às 8h (horário de Brasília = 11h UTC)
  schedule:
    - cron: '0 11 * * 1'

  # Permite rodar manualmente pelo GitHub a qualquer hora
  workflow_dispatch:

jobs:
  monitorar:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar o código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: pip install -r requirements.txt

      - name: 🔎 Rodar o monitor e enviar e-mail
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          SENHA_APP:       ${{ secrets.SENHA_APP }}
          EMAIL_DESTINO:   ${{ secrets.EMAIL_DESTINO }}
        run: python monitor.py
